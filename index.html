<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#234b2a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cubage Bois" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Cubage Bois Terrain</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <h1>Cubage Bois Terrain</h1>
      <p>PWA hors ligne — Adrian I / Adrian II</p>
    </div>
    <button id="installBtn" class="secondary hidden">Installer</button>
  </header>

  <main>
    <section class="card">
      <h2>1. Chantier / parcelle</h2>
      <div class="grid two">
        <label>Nom du chantier
          <input id="chantier" type="text" placeholder="Ex. Longpont - Parcelle 12" />
        </label>
        <label>Date
          <input id="dateChantier" type="date" />
        </label>
      </div>
      <div class="actions">
        <button id="saveChantierBtn">Enregistrer le chantier</button>
        <button id="resetBtn" class="danger">Nouveau chantier</button>
      </div>
    </section>

    <section class="card">
      <h2>2. Saisie arbre</h2>
      <div class="grid two">
        <label>Essence
          <select id="essence">
            <option>Chêne</option>
            <option>Hêtre</option>
            <option>Frêne</option>
            <option>Châtaignier</option>
            <option>Peuplier</option>
            <option>Érable</option>
            <option>Merisier</option>
            <option>Résineux</option>
            <option>Autre</option>
          </select>
        </label>
        <label>Qualité courante
          <select id="qualiteCourante">
            <option>Sciage courant</option>
            <option>Bois d'œuvre</option>
            <option>Palette</option>
            <option>Industrie</option>
          </select>
        </label>
      </div>

      <div class="grid two">
        <label>Diamètre à 1,30 m (cm)
          <input id="diametre" type="number" min="10" step="1" placeholder="Ex. 45" inputmode="decimal" />
        </label>
        <label>Hauteur sciable totale (m)
          <input id="hauteurTotale" type="number" min="0" step="0.5" placeholder="Ex. 12" inputmode="decimal" />
        </label>
      </div>

      <div class="toggle-row">
        <label class="checkbox"><input id="hasSup" type="checkbox" /> Bille de pied qualité supérieure</label>
      </div>

      <div id="supFields" class="subcard hidden">
        <div class="grid two">
          <label>Qualité supérieure
            <select id="qualiteSup">
              <option>Tranchage</option>
              <option>Merrain</option>
              <option>Menuiserie</option>
              <option>Ébénisterie</option>
              <option>Autre qualité supérieure</option>
            </select>
          </label>
          <label>Longueur bille supérieure (m)
            <input id="longueurSup" type="number" min="0" step="0.5" placeholder="Ex. 4" inputmode="decimal" />
          </label>
        </div>
      </div>

      <div class="preview" id="preview">Saisissez un diamètre et une hauteur.</div>

      <div class="actions sticky-actions">
        <button id="addTreeBtn" class="primary">Ajouter l’arbre</button>
        <button id="undoBtn" class="secondary">Annuler dernier arbre</button>
      </div>
    </section>

    <section class="card">
      <h2>3. Synthèse</h2>
      <p class="note">La tête est calculée en fin d’inventaire, par essence : total bois d’œuvre × 1,5.</p>
      <div id="summary"></div>
      <div class="actions">
        <button id="exportCsvBtn">Export CSV / Excel</button>
        <button id="printPdfBtn">Export PDF</button>
      </div>
    </section>

    <section class="card">
      <h2>4. Détail des arbres</h2>
      <div class="table-wrap">
        <table id="treeTable">
          <thead>
            <tr>
              <th>#</th><th>Essence</th><th>D</th><th>H BO</th><th>Sup.</th><th>Courant</th><th>Total BO</th><th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
